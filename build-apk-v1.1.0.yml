      # =========================================================
      # 24. BUILD DEBUG APK
      # =========================================================
      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

      # =========================================================
      # FORCE UPDATE APP VERSION — v1.1.0 / versionCode 2
      # =========================================================
      - name: Set app version for update system
        shell: bash
        run: |
          set -e
          python3 - <<'PY2'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if re.search(r"versionCode\s+\d+", s):
              s = re.sub(r"versionCode\s+\d+", "versionCode 2", s, count=1)
          else:
              s = s.replace("defaultConfig {", "defaultConfig {\n        versionCode 2", 1)
          if re.search(r"versionName\s+['\"][^'\"]+['\"]", s):
              s = re.sub(r"versionName\s+['\"][^'\"]+['\"]", 'versionName "1.1.0"', s, count=1)
          else:
              s = s.replace("defaultConfig {", 'defaultConfig {\n        versionName "1.1.0"', 1)
          p.write_text(s)
          PY2
          grep -n "versionCode\|versionName" android/app/build.gradle | head -10


          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


