name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, repair-security-fcm-2026-09]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare notification sound
        shell: bash
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import math, wave, struct
          path="assets/notif.wav"
          rate=44100
          duration=0.32
          frames=[]
          for i in range(int(rate*duration)):
              t=i/rate
              f=880 if t < 0.16 else 1174
              amp=0.28 * (1 - t/duration)
              frames.append(struct.pack("<h", int(32767*amp*math.sin(2*math.pi*f*t))))
          with wave.open(path,"w") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(b"".join(frames))
          PY

      - name: Verify exact CEK VAR icon is present
        shell: bash
        run: |
          set -e
          test -f assets/icon.png
          test -f assets/push_icon.png
          echo "CEK VAR icon assets ditemukan."

      - name: Generate Android platform
        run: npx cap add android

      - name: Copy Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Build web/native bridge
        run: npm run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android resources
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/notif.wav android/app/src/main/res/raw/notif.wav
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon.png android/app/src/main/res/drawable/cek_var_icon.png
          cp assets/push_icon.png android/app/src/main/res/drawable/push_icon.png

      - name: Configure Google Services plugin
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/build.gradle")
          s=p.read_text()
          if "com.google.gms:google-services:4.4.4" not in s:
              marker="dependencies {"
              i=s.find(marker)
              if i < 0: raise SystemExit("dependencies block tidak ditemukan")
              end=s.find("}", i)
              s=s[:end] + "\n        classpath 'com.google.gms:google-services:4.4.4'" + s[end:]
              p.write_text(s)
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if "com.google.gms.google-services" not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"
              p.write_text(s)
          PY

      - name: Configure FCM default resources
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/firebase_messaging.xml <<'EOF'
          <resources>
            <string name="default_notification_channel_id">pengumuman_fcm_v3</string>
          </resources>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker="</application>"
          meta='    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/push_icon" />\n'
          if "com.google.firebase.messaging.default_notification_icon" not in s:
              s=s.replace(marker,meta+marker,1)
          # Force the launcher icon to the CEK VAR asset, regardless of Capacitor defaults.
          import re
          s=re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/cek_var_icon"', s, count=1)
          s=re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/cek_var_icon"', s, count=1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parkir-mobil-tamu-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
