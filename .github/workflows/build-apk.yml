name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "repair/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify project and exact CEK VAR icon
        shell: bash
        run: |
          set -e
          test -f www/index.html
          test -f package.json
          test -f capacitor.config.ts
          test -f src/native-bridge.js
          test -f google-services.json
          test -f assets/icon.png
          echo "CEK VAR icon found: assets/icon.png"
          node -e 'const p=require("./google-services.json"); if(p.project_info?.project_id!=="parkir-mobil") process.exit(1); const c=p.client?.find(x=>x.client_info?.android_client_info?.package_name==="com.parkiranmobiltamu.app"); if(!c) process.exit(2); console.log("Firebase config OK")'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle native bridge
        run: npx esbuild src/native-bridge.js --bundle --format=iife --platform=browser --outfile=www/native-bridge.js

      - name: Create Android platform
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          test -f android/gradlew

      - name: Install Firebase Android config
        run: cp google-services.json android/app/google-services.json

      - name: Configure Google Services
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root=Path("android/build.gradle")
          app=Path("android/app/build.gradle")
          r=root.read_text()
          a=app.read_text()
          if "com.google.gms:google-services" not in r:
              marker="classpath 'com.android.tools.build:gradle:8.13.0'"
              if marker in r:
                  r=r.replace(marker, marker+"\n        classpath 'com.google.gms:google-services:4.5.0'",1)
              else:
                  raise SystemExit("Android root Gradle tidak memakai format Capacitor yang diharapkan")
              root.write_text(r)
          if "com.google.gms.google-services" not in a:
              marker="apply plugin: 'com.android.application'"
              if marker in a:
                  a=a.replace(marker, marker+"\napply plugin: 'com.google.gms.google-services'",1)
              else:
                  raise SystemExit("Android app Gradle tidak memakai format yang diharapkan")
              app.write_text(a)
          PY

      - name: Prepare CEK VAR launcher icon
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "$RES/mipmap-$d"; done
          convert assets/icon.png -resize 48x48 "$RES/mipmap-mdpi/ic_launcher.png"
          convert assets/icon.png -resize 72x72 "$RES/mipmap-hdpi/ic_launcher.png"
          convert assets/icon.png -resize 96x96 "$RES/mipmap-xhdpi/ic_launcher.png"
          convert assets/icon.png -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert assets/icon.png -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"; done

      - name: Prepare notification sound and icon
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable android/app/src/main/res/values
          python3 - <<'PY'
          import wave, math, struct
          p="android/app/src/main/res/raw/notif.wav"
          rate=44100
          frames=[]
          for i in range(int(rate*0.45)):
              t=i/rate
              f=880 if t<0.22 else 1175
              frames.append(struct.pack("<h", int(32767*0.30*math.sin(2*math.pi*f*t))))
          with wave.open(p,"wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(b"".join(frames))
          PY
          convert assets/icon.png -resize 96x96 -colorspace Gray -threshold 65% android/app/src/main/res/drawable/push_icon.png
          cat > android/app/src/main/res/values/fcm_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="default_notification_channel_id">pengumuman_fcm_v3</string></resources>
          XML

      - name: Configure Android manifest and notification channel
        shell: bash
        run: |
          set -e
          MAIN=android/app/src/main/java/com/parkiranmobiltamu/app/MainActivity.java
          mkdir -p "$(dirname "$MAIN")"
          find android/app/src/main/java -type f \( -name 'MainActivity.java' -o -name 'MainActivity.kt' \) -delete || true
          cat > "$MAIN" <<'JAVA'
          package com.parkiranmobiltamu.app;
          import android.app.*;
          import android.content.*;
          import android.media.*;
          import android.net.Uri;
          import android.os.*;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private static final String CHANNEL_ID="pengumuman_fcm_v3";
            @Override public void onCreate(Bundle state){
              super.onCreate(state);
              if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O){
                NotificationManager nm=(NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE);
                if(nm!=null && nm.getNotificationChannel(CHANNEL_ID)==null){
                  Uri sound=Uri.parse(ContentResolver.SCHEME_ANDROID_RESOURCE+"://"+getPackageName()+"/"+R.raw.notif);
                  AudioAttributes aa=new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                  NotificationChannel c=new NotificationChannel(CHANNEL_ID,"Pengumuman Parkir",NotificationManager.IMPORTANCE_HIGH);
                  c.setSound(sound,aa); c.enableVibration(true); nm.createNotificationChannel(c);
                }
              }
            }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              i=s.find(">",s.find("<manifest"))
              s=s[:i+1]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'+s[i+1:]
          if 'com.google.firebase.messaging.default_notification_icon' not in s:
              i=s.find(">",s.find("<application"))
              meta='\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/push_icon" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:resource="@string/default_notification_channel_id" />'
              s=s[:i+1]+meta+s[i+1:]
          p.write_text(s)
          PY

      - name: Capacitor sync
        run: npx cap sync android

      - name: Verify icon and Android package
        shell: bash
        run: |
          set -e
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml || true
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do test -s "android/app/src/main/res/mipmap-$d/ic_launcher.png"; done
          test -s android/app/src/main/res/raw/notif.wav
          test -s android/app/src/main/res/drawable/push_icon.png

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parkir-mobil-tamu-secure-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
