      # versionCode 2
      # versionName 1.1.0
      # =========================================================
      - name: Set app version
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()


          # versionCode

          if re.search(
              r"versionCode\s+\d+",
              text
          ):

              text = re.sub(
                  r"versionCode\s+\d+",
                  "versionCode 2",
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  "defaultConfig {",
                  "defaultConfig {\n"
                  "        versionCode 2",
                  1
              )


          # versionName

          if re.search(
              r'versionName\s+[\'"][^\'"]+[\'"]',
              text
          ):

              text = re.sub(
                  r'versionName\s+[\'"][^\'"]+[\'"]',
                  'versionName "1.1.0"',
                  text,
                  count=1
              )

          else:

              text = text.replace(
                  "defaultConfig {",
                  'defaultConfig {\n'
                  '        versionName "1.1.0"',
                  1
              )


          path.write_text(text)

          print(
              "versionCode = 2"
          )

          print(
              "versionName = 1.1.0"
          )
