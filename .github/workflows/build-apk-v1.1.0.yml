name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f www/index.html
          test -f capacitor.config.ts
          test -f google-services.json
          test -f src/native-bridge.js

          echo "Project structure OK."

      - name: Verify Firebase
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          if (data.project_info?.project_id !== "parkir-mobil") {
            throw new Error("Firebase project harus parkir-mobil");
          }

          const found = (data.client || []).some(
            client =>
              client.client_info?.android_client_info?.package_name ===
              "com.parkiranmobiltamu.app"
          );

          if (!found) {
            throw new Error(
              "Package com.parkiranmobiltamu.app tidak ditemukan"
            );
          }

          console.log("Firebase config OK.");
          NODE

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          npm install \
            --no-audit \
            --no-fund

          npx cap --version
          npx esbuild --version
          npx tsc --version

      - name: Bundle native bridge
        shell: bash
        run: |
          set -e

          mkdir -p www

          npx esbuild \
            src/native-bridge.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/native-bridge.js

          test -s www/native-bridge.js

      - name: Verify web assets
        shell: bash
        run: |
          set -e

          test -s www/index.html
          test -s www/native-bridge.js

          grep -q "native-bridge.js" www/index.html

      - name: Create Android platform
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          fi

          test -f android/gradlew

      - name: Install Firebase Android config
        shell: bash
        run: |
          set -e

          mkdir -p android/app

          cp \
            google-services.json \
            android/app/google-services.json

          test -f android/app/google-services.json

      - name: Verify Android Gradle setup
        shell: bash
        run: |
          set -e

          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          echo "Gradle setup OK."

      - name: Prepare assets
        shell: bash
        run: |
          set -e

          mkdir -p assets

          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
          elif [ -f www/icon.png ]; then
            cp www/icon.png assets/icon.png
          fi

          if [ ! -f assets/icon.png ]; then
            python3 <<'PY'
          import struct
          import zlib

          width = 192
          height = 192

          rows = []

          for y in range(height):
              row = bytearray([0])

              for x in range(width):
                  dx = x - width / 2
                  dy = y - height / 2
                  radius = (dx * dx + dy * dy) ** 0.5

                  if radius < 78:
                      pixel = (235, 235, 235, 255)
                  else:
                      pixel = (18, 18, 18, 255)

                  row.extend(pixel)

              rows.append(bytes(row))

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(
                      ">I",
                      zlib.crc32(kind + data) & 0xffffffff
                  )
              )

          raw = b"".join(rows)

          png = b"\x89PNG\r\n\x1a\n"

          png += chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  width,
                  height,
                  8,
                  6,
                  0,
                  0,
                  0
              )
          )

          png += chunk(
              b"IDAT",
              zlib.compress(raw, 9)
          )

          png += chunk(b"IEND", b"")

          with open("assets/icon.png", "wb") as f:
              f.write(png)
          PY
          fi

          cp assets/icon.png assets/push_icon.png

      - name: Install ImageMagick
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate launcher icons
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          convert assets/icon.png -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert assets/icon.png -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert assets/icon.png -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert assets/icon.png -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert assets/icon.png -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          for D in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            cp \
              "$RES/mipmap-$D/ic_launcher.png" \
              "$RES/mipmap-$D/ic_launcher_round.png"
          done

      - name: Normalize launcher resources
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -f \
            "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" \
            "$RES/mipmap-anydpi-v33/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v33/ic_launcher_round.xml" \
            "$RES/mipmap-anydpi-v35/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v35/ic_launcher_round.xml" \
            2>/dev/null || true

      - name: Configure launcher icon
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          start = text.find("<application")

          if start < 0:
              raise SystemExit("application tag tidak ditemukan")

          end = text.find(">", start)

          tag = text[start:end]

          tag = re.sub(
              r'\s+android:icon="[^"]*"',
              "",
              tag
          )

          tag = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              "",
              tag
          )

          tag += (
              ' android:icon="@mipmap/ic_launcher"'
              ' android:roundIcon="@mipmap/ic_launcher_round"'
          )

          manifest.write_text(
              text[:start] + tag + text[end:]
          )
          PY

      - name: Prepare notification resources
        shell: bash
        run: |
          set -e

          mkdir -p \
            android/app/src/main/res/raw \
            android/app/src/main/res/drawable \
            android/app/src/main/res/values

          cp \
            assets/push_icon.png \
            android/app/src/main/res/drawable/push_icon.png

          if [ -f assets/notif.wav ]; then
            cp \
              assets/notif.wav \
              android/app/src/main/res/raw/notif.wav
          else
            python3 <<'PY'
          import wave
          import math
          import struct

          filename = (
              "android/app/src/main/res/raw/notif.wav"
          )

          rate = 44100
          duration = 0.45
          frames = []

          for i in range(int(rate * duration)):
              t = i / rate
              freq = 880 if t < 0.22 else 1175

              sample = int(
                  32767 * 0.35 *
                  math.sin(2 * math.pi * freq * t)
              )

              frames.append(struct.pack("<h", sample))

          with wave.open(filename, "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              wav.writeframes(b"".join(frames))
          PY
          fi

          cat > android/app/src/main/res/values/fcm_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_notification_channel_id">pengumuman_fcm_v3</string>
          </resources>
          XML

      - name: Configure FCM manifest
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              pos = text.find(">")
              text = (
                  text[:pos + 1]
                  + "\n    "
                  + permission
                  + "\n"
                  + text[pos + 1:]
              )

          icon_meta = (
              '<meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/push_icon" />'
          )

          channel_meta = (
              '<meta-data '
              'android:name="com.google.firebase.messaging.default_notification_channel_id" '
              'android:resource="@string/default_notification_channel_id" />'
          )

          app_end = text.find(">", text.find("<application"))

          block = text[text.find("<application"):app_end]

          if "default_notification_icon" not in block:
              text = (
                  text[:app_end + 1]
                  + "\n        "
                  + icon_meta
                  + "\n        "
                  + channel_meta
                  + "\n"
                  + text[app_end + 1:]
              )

          manifest.write_text(text)
          PY

      - name: Configure secure APK updater
        shell: bash
        run: |
          set -e

          MAIN_DIR="android/app/src/main/java/com/parkiranmobiltamu/app"

          mkdir -p "$MAIN_DIR"
          mkdir -p android/app/src/main/res/xml

          cat > "$MAIN_DIR/AppUpdater.java" <<'JAVA'
          package com.parkiranmobiltamu.app;

          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.PluginMethod;

          import java.io.*;
          import java.net.*;
          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdater extends Plugin {

              @PluginMethod
              public void downloadAndInstall(PluginCall call) {

                  String urlText =
                      call.getString("url", "");

                  String expectedSha256 =
                      call.getString("sha256", "");

                  String expectedPackage =
                      call.getString(
                          "packageName",
                          "com.parkiranmobiltamu.app"
                      );

                  long expectedVersionCode =
                      call.getLong("versionCode", 0L);

                  if (!urlText.startsWith("https://")) {
                      call.reject(
                          "Update hanya boleh menggunakan HTTPS."
                      );
                      return;
                  }

                  try {
                      String host =
                          new URL(urlText)
                              .getHost()
                              .toLowerCase(Locale.US);

                      if (!host.equals("github.com") &&
                          !host.equals("www.github.com")) {
                          call.reject(
                              "Sumber APK tidak diizinkan."
                          );
                          return;
                      }
                  } catch (Exception e) {
                      call.reject("URL update tidak valid.");
                      return;
                  }

                  if (!expectedPackage.equals(
                      getContext().getPackageName()
                  )) {
                      call.reject("Package APK tidak cocok.");
                      return;
                  }

                  Executors.newSingleThreadExecutor().execute(() -> {

                      File apk = null;

                      try {

                          if (Build.VERSION.SDK_INT >= 26 &&
                              !getContext()
                                  .getPackageManager()
                                  .canRequestPackageInstalls()) {

                              Intent settings =
                                  new Intent(
                                      Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                      Uri.parse(
                                          "package:" +
                                          getContext().getPackageName()
                                      )
                                  );

                              settings.addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK
                              );

                              getContext().startActivity(settings);

                              call.reject(
                                  "IZIN_INSTALL_REQUIRED",
                                  "Izinkan pemasangan aplikasi dari sumber ini, lalu tekan UPDATE APK lagi."
                              );

                              return;
                          }

                          apk = downloadApk(urlText);

                          if (!expectedSha256.isEmpty() &&
                              !sha256(apk)
                                  .equalsIgnoreCase(expectedSha256)) {

                              apk.delete();

                              call.reject(
                                  "HASH_MISMATCH",
                                  "SHA-256 APK tidak cocok."
                              );

                              return;
                          }

                          PackageManager pm =
                              getContext().getPackageManager();

                          PackageInfo info =
                              pm.getPackageArchiveInfo(
                                  apk.getAbsolutePath(),
                                  PackageManager.GET_META_DATA
                              );

                          if (info == null ||
                              !expectedPackage.equals(
                                  info.packageName
                              )) {

                              apk.delete();

                              call.reject(
                                  "PACKAGE_MISMATCH",
                                  "Package APK tidak cocok."
                              );

                              return;
                          }

                          long version =
                              Build.VERSION.SDK_INT >= 28
                                  ? info.getLongVersionCode()
                                  : info.versionCode;

                          if (expectedVersionCode > 0 &&
                              version != expectedVersionCode) {

                              apk.delete();

                              call.reject(
                                  "VERSION_MISMATCH",
                                  "VersionCode APK tidak cocok."
                              );

                              return;
                          }

                          File installFile =
                              new File(
                                  getContext().getCacheDir(),
                                  "parkir-update.apk"
                              );

                          if (installFile.exists()) {
                              installFile.delete();
                          }

                          if (!apk.renameTo(installFile)) {
                              copyFile(apk, installFile);
                              apk.delete();
                          }

                          Uri uri =
                              FileProvider.getUriForFile(
                                  getContext(),
                                  getContext().getPackageName()
                                      + ".fileprovider",
                                  installFile
                              );

                          Intent intent =
                              new Intent(Intent.ACTION_VIEW);

                          intent.setDataAndType(
                              uri,
                              "application/vnd.android.package-archive"
                          );

                          intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          );

                          getContext().startActivity(intent);

                          call.resolve();

                      } catch (Exception e) {

                          if (apk != null && apk.exists()) {
                              apk.delete();
                          }

                          call.reject(
                              "UPDATE_FAILED",
                              e.getMessage() == null
                                  ? "Download/update gagal."
                                  : e.getMessage()
                          );
                      }
                  });
              }

              private File downloadApk(String urlText)
                  throws Exception {

                  File dir =
                      new File(
                          getContext().getCacheDir(),
                          "updates"
                      );

                  if (!dir.exists() && !dir.mkdirs()) {
                      throw new Exception(
                          "Folder update tidak dapat dibuat."
                      );
                  }

                  File out =
                      new File(
                          dir,
                          "parkir-update-download.apk"
                      );

                  HttpURLConnection connection =
                      (HttpURLConnection)
                          new URL(urlText).openConnection();

                  connection.setInstanceFollowRedirects(true);
                  connection.setConnectTimeout(15000);
                  connection.setReadTimeout(30000);
                  connection.connect();

                  int response =
                      connection.getResponseCode();

                  if (response < 200 || response >= 300) {
                      throw new Exception(
                          "Server update HTTP " + response
                      );
                  }

                  long maxSize =
                      60L * 1024L * 1024L;

                  try (
                      InputStream in =
                          connection.getInputStream();

                      FileOutputStream output =
                          new FileOutputStream(out)
                  ) {

                      byte[] buffer = new byte[8192];
                      int count;
                      long total = 0;

                      while ((count = in.read(buffer)) != -1) {

                          total += count;

                          if (total > maxSize) {
                              throw new Exception(
                                  "Ukuran APK terlalu besar."
                              );
                          }

                          output.write(
                              buffer,
                              0,
                              count
                          );
                      }

                  } finally {
                      connection.disconnect();
                  }

                  return out;
              }

              private String sha256(File file)
                  throws Exception {

                  MessageDigest digest =
                      MessageDigest.getInstance("SHA-256");

                  try (
                      InputStream input =
                          new FileInputStream(file)
                  ) {

                      byte[] buffer = new byte[8192];
                      int count;

                      while ((count = input.read(buffer)) != -1) {
                          digest.update(
                              buffer,
                              0,
                              count
                          );
                      }
                  }

                  StringBuilder result =
                      new StringBuilder();

                  for (byte b : digest.digest()) {
                      result.append(
                          String.format(
                              Locale.US,
                              "%02x",
                              b
                          )
                      );
                  }

                  return result.toString();
              }

              private void copyFile(
                  File source,
                  File destination
              ) throws Exception {

                  try (
                      InputStream input =
                          new FileInputStream(source);

                      OutputStream output =
                          new FileOutputStream(destination)
                  ) {

                      byte[] buffer = new byte[8192];
                      int count;

                      while ((count = input.read(buffer)) != -1) {
                          output.write(
                              buffer,
                              0,
                              count
                          );
                      }
                  }
              }
          }
          JAVA

          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="update_cache"
                  path="updates/" />
              <cache-path
                  name="root_cache"
                  path="." />
          </paths>
          XML

          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          )

          if permission not in text:
              pos = text.find(">")
              text = (
                  text[:pos + 1]
                  + "\n    "
                  + permission
                  + "\n"
                  + text[pos + 1:]
              )

          provider = """
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
          """

          if "${applicationId}.fileprovider" not in text:
              pos = text.find("</application>")
              text = (
                  text[:pos]
                  + provider
                  + "\n"
                  + text[pos:]
              )

          manifest.write_text(text)
          PY

      - name: Sync Capacitor
        shell: bash
        run: |
          set -e

          npx cap sync android

          chmod +x android/gradlew

      - name: Set app version
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          text = path.read_text()

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode 2",
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+[\'"][^\'"]+[\'"]',
              'versionName "1.1.0"',
              text,
              count=1
          )

          path.write_text(text)
          PY

          grep -n \
            "versionCode\|versionName" \
            android/app/build.gradle

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          echo "APK: $APK"

          ls -lh "$APK"

          sha256sum "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p dist

          APK=$(find \
            android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp \
            "$APK" \
            dist/parkir-mobil-tamu-v1.1.0-debug.apk

          sha256sum \
            dist/parkir-mobil-tamu-v1.1.0-debug.apk \
            > dist/parkir-mobil-tamu-v1.1.0-debug.apk.sha256

          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parkir-mobil-tamu-v1.1.0-debug-apk
          path: |
            dist/parkir-mobil-tamu-v1.1.0-debug.apk
            dist/parkir-mobil-tamu-v1.1.0-debug.apk.sha256
          if-no-files-found: error

      - name: Build success
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD BERHASIL"
          echo "PARKIR MOBIL TAMU"
          echo "Version: 1.1.0"
          echo "VersionCode: 2"
          echo "========================================"
