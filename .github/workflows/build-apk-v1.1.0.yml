name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout project
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE.JS 22
      # Capacitor 8 membutuhkan Node.js 22+
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm


      # =========================================================
      # 3. JAVA 21
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # =========================================================
      # 4. VERIFY PROJECT
      # =========================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PARKIR MOBIL TAMU"
          echo "PROJECT CHECK"
          echo "========================================"

          test -f www/index.html
          test -f package.json
          test -f capacitor.config.ts
          test -f google-services.json
          test -f src/native-bridge.js

          echo "OK: www/index.html"
          echo "OK: package.json"
          echo "OK: capacitor.config.ts"
          echo "OK: google-services.json"
          echo "OK: src/native-bridge.js"

          echo ""
          echo "Project structure OK."


      # =========================================================
      # 5. VERIFY FIREBASE CONFIG
      # =========================================================
      - name: Verify Firebase config
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("google-services.json", "utf8")
          );

          const projectId =
            data.project_info?.project_id || "";

          if (projectId !== "parkir-mobil") {
            throw new Error(
              "Firebase project harus parkir-mobil"
            );
          }

          const clients = data.client || [];

          const found = clients.some(
            x =>
              x.client_info?.android_client_info?.package_name ===
              "com.parkiranmobiltamu.app"
          );

          if (!found) {
            throw new Error(
              "Package com.parkiranmobiltamu.app tidak ditemukan di google-services.json"
            );
          }

          console.log(
            "Firebase project:",
            projectId
          );

          console.log(
            "Android package: com.parkiranmobiltamu.app"
          );

          console.log("Firebase config OK.");
          NODE


      # =========================================================
      # 6. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "Installing npm dependencies..."

          npm install \
            --no-audit \
            --no-fund

          echo ""
          echo "Ensuring required packages..."

          npm install \
            @capacitor/core@8.0.0 \
            @capacitor/cli@8.0.0 \
            @capacitor/android@8.0.0 \
            @capacitor/camera@8.2.4 \
            @capacitor/local-notifications@8.3.1 \
            @capacitor-firebase/messaging@8.5.2 \
            @capgo/capacitor-speech-recognition@8.3.2 \
            @capgo/capacitor-speech-synthesis@8.0.22 \
            firebase@12.19.0 \
            esbuild@0.25.0 \
            typescript@5.9.3 \
            --save \
            --no-audit \
            --no-fund

          echo ""
          echo "Installed versions:"
          npx cap --version
          npx esbuild --version
          npx tsc --version

          echo ""
          echo "Dependencies OK."


      # =========================================================
      # 7. VERIFY CAPACITOR CONFIG
      # =========================================================
      - name: Verify Capacitor config
        shell: bash
        run: |
          set -e

          echo "capacitor.config.ts:"
          cat capacitor.config.ts

          grep -q "com.parkiranmobiltamu.app" \
            capacitor.config.ts

          grep -q "PARKIR MOBIL TAMU" \
            capacitor.config.ts

          grep -q "webDir: 'www'" \
            capacitor.config.ts

          echo ""
          echo "Capacitor config OK."


      # =========================================================
      # 8. NORMALIZE ASSETS
      # =========================================================
      - name: Normalize app assets
        shell: bash
        run: |
          set -e

          mkdir -p assets

          # -----------------------------------------------------
          # APP ICON
          # -----------------------------------------------------
          if [ ! -f assets/icon.png ]; then

            if [ -f icon.png ]; then
              cp icon.png assets/icon.png

            elif [ -f www/icon.png ]; then
              cp www/icon.png assets/icon.png

            fi

          fi


          # -----------------------------------------------------
          # FALLBACK ICON
          # -----------------------------------------------------
          if [ ! -f assets/icon.png ]; then

            echo "Creating fallback icon..."

            python3 <<'PY'
          import struct
          import zlib

          width = 192
          height = 192

          rows = []

          for y in range(height):

              row = bytearray([0])

              for x in range(width):

                  dx = x - width / 2
                  dy = y - height / 2

                  radius = (dx * dx + dy * dy) ** 0.5

                  if radius < 78:
                      pixel = (235, 235, 235, 255)
                  else:
                      pixel = (18, 18, 18, 255)

                  row.extend(pixel)

              rows.append(bytes(row))


          def chunk(kind, data):

              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(
                      ">I",
                      zlib.crc32(kind + data)
                      & 0xffffffff
                  )
              )


          raw = b"".join(rows)

          png = b"\x89PNG\r\n\x1a\n"

          png += chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  width,
                  height,
                  8,
                  6,
                  0,
                  0,
                  0
              )
          )

          png += chunk(
              b"IDAT",
              zlib.compress(raw, 9)
          )

          png += chunk(
              b"IEND",
              b""
          )

          with open(
              "assets/icon.png",
              "wb"
          ) as f:
              f.write(png)

          print("Fallback icon created.")
          PY

          fi


          # -----------------------------------------------------
          # PUSH ICON
          # -----------------------------------------------------
          if [ ! -f assets/push_icon.png ]; then
            cp assets/icon.png assets/push_icon.png
          fi


          echo ""
          echo "Assets OK."

          ls -lh assets/


      # =========================================================
      # 9. BUNDLE NATIVE BRIDGE
      # =========================================================
      - name: Bundle native bridge
        shell: bash
        run: |
          set -e

          mkdir -p www

          npx esbuild \
            src/native-bridge.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/native-bridge.js

          test -s www/native-bridge.js

          echo ""
          echo "Native bridge bundled successfully."

          ls -lh www/native-bridge.js


      # =========================================================
      # 10. VERIFY WEB ASSETS
      # =========================================================
      - name: Verify web assets
        shell: bash
        run: |
          set -e

          test -f www/index.html
          test -s www/native-bridge.js

          grep -q "native-bridge.js" \
            www/index.html

          echo "Web assets OK."


      # =========================================================
      # 11. CREATE ANDROID PLATFORM
      # =========================================================
      - name: Create Android platform
        shell: bash
        run: |
          set -e

          if [ -d android ]; then
            echo "Android folder already exists."
          else
            echo "Creating Android platform..."
            npx cap add android
          fi

          test -f android/gradlew

          echo ""
          echo "Android platform OK."


      # =========================================================
      # 12. INSTALL FIREBASE CONFIG
      # =========================================================
      - name: Install Firebase Android config
        shell: bash
        run: |
          set -e

          mkdir -p android/app

          cp \
            google-services.json \
            android/app/google-services.json

          test -f \
            android/app/google-services.json

          echo "google-services.json installed."


      # =========================================================
      # 13. CONFIGURE GOOGLE SERVICES
      # =========================================================
      - name: Configure Google Services Gradle plugin
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android")
          root_gradle = root / "build.gradle"
          app_gradle = root / "app" / "build.gradle"

          if not root_gradle.exists():
              raise SystemExit(
                  "android/build.gradle tidak ditemukan"
              )

          if not app_gradle.exists():
              raise SystemExit(
                  "android/app/build.gradle tidak ditemukan"
              )


          # =====================================================
          # ROOT GRADLE
          # =====================================================

          root_text = root_gradle.read_text()

          google_plugin = (
              "classpath 'com.google.gms:google-services:4.4.4'"
          )

          if google_plugin not in root_text:

              marker = (
                  "classpath 'com.android.tools.build:gradle:8.13.0'"
              )

              if marker in root_text:

                  root_text = root_text.replace(
                      marker,
                      marker
                      + "\n"
                      + "        "
                      + google_plugin,
                      1
                  )

              else:

                  raise SystemExit(
                      "Tidak menemukan Android Gradle Plugin "
                      "di android/build.gradle"
                  )

              root_gradle.write_text(root_text)


          # =====================================================
          # APP GRADLE
          # =====================================================

          app_text = app_gradle.read_text()

          plugin_line = (
              "apply plugin: 'com.google.gms.google-services'"
          )

          if "com.google.gms.google-services" not in app_text:

              marker = (
                  "apply plugin: 'com.android.application'"
              )

              if marker in app_text:

                  app_text = app_text.replace(
                      marker,
                      marker
                      + "\n"
                      + plugin_line,
                      1
                  )

              else:

                  app_text = (
                      plugin_line
                      + "\n"
                      + app_text
                  )

              app_gradle.write_text(app_text)


          print(
              "Google Services Gradle plugin configured."
          )
          PY


      # =========================================================
      # 14. INSTALL IMAGEMAGICK
      # =========================================================
      - name: Install ImageMagick
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install \
            -y imagemagick

          convert --version


      # =========================================================
      # 15. GENERATE LAUNCHER ICON
      # =========================================================
      - name: Generate CEK VAR launcher icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"


          # -----------------------------------------------------
          # Generate legacy bitmap icons
          # -----------------------------------------------------

          convert \
            assets/icon.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert \
            assets/icon.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert \
            assets/icon.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert \
            assets/icon.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert \
            assets/icon.png \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          # -----------------------------------------------------
          # Round versions
          # -----------------------------------------------------

          for D in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do

            cp \
              "$RES/mipmap-$D/ic_launcher.png" \
              "$RES/mipmap-$D/ic_launcher_round.png"

          done


          echo ""
          echo "Launcher bitmap icons generated."


      # =========================================================
      # 16. REMOVE GENERATED ADAPTIVE ICON CONFLICT
      #
      # Adaptive icons are valid Android resources.
      # We remove them here only so the generated CEK VAR
      # bitmap icon is definitely the icon used by this build.
      # =========================================================
      - name: Normalize launcher icon resources
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          rm -f \
            "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          rm -f \
            "$RES/mipmap-anydpi-v33/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v33/ic_launcher_round.xml"

          rm -f \
            "$RES/mipmap-anydpi-v35/ic_launcher.xml" \
            "$RES/mipmap-anydpi-v35/ic_launcher_round.xml"

          echo "Adaptive launcher XML normalized."


      # =========================================================
      # 17. FORCE APP ICON
      # =========================================================
      - name: Force CEK VAR app icon
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          start = text.find("<application")

          if start < 0:
              raise SystemExit(
                  "application tag tidak ditemukan"
              )

          end = text.find(">", start)

          if end < 0:
              raise SystemExit(
                  "application tag tidak valid"
              )

          tag = text[start:end]

          tag = re.sub(
              r'\s+android:icon="[^"]*"',
              "",
              tag
          )

          tag = re.sub(
              r'\s+android:roundIcon="[^"]*"',
              "",
              tag
          )

          tag += (
              ' android:icon="@mipmap/ic_launcher"'
              ' android:roundIcon="@mipmap/ic_launcher_round"'
          )

          text = (
              text[:start]
              + tag
              + text[end:]
          )

          manifest.write_text(text)

          print(
              "Manifest launcher icon configured."
          )
          PY


      # =========================================================
      # 18. VERIFY LAUNCHER ICON
      # =========================================================
      - name: Verify CEK VAR launcher icon
        shell: bash
        run: |
          set -e

          RES="android/app/src/main/res"

          for D in \
            mdpi \
            hdpi \
            xhdpi \
            xxhdpi \
            xxxhdpi
          do

            test -s \
              "$RES/mipmap-$D/ic_launcher.png"

            test -s \
              "$RES/mipmap-$D/ic_launcher_round.png"

          done

          grep -q \
            'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml

          echo "Launcher icon verification OK."


      # =========================================================
      # 19. NOTIFICATION SOUND
      # =========================================================
      - name: Prepare notification sound
        shell: bash
        run: |
          set -e

          mkdir -p \
            android/app/src/main/res/raw

          if [ -f assets/notif.wav ]; then

            cp \
              assets/notif.wav \
              android/app/src/main/res/raw/notif.wav

          else

            echo "Creating fallback notification sound..."

            python3 <<'PY'
          import wave
          import math
          import struct

          filename = (
              "android/app/src/main/res/raw/notif.wav"
          )

          sample_rate = 44100
          duration = 0.45
          volume = 0.35

          frames = []

          for i in range(
              int(sample_rate * duration)
          ):

              t = i / sample_rate

              if t < 0.22:
                  frequency = 880
              else:
                  frequency = 1175

              sample = int(
                  32767
                  * volume
                  * math.sin(
                      2
                      * math.pi
                      * frequency
                      * t
                  )
              )

              frames.append(
                  struct.pack(
                      "<h",
                      sample
                  )
              )

          with wave.open(
              filename,
              "wb"
          ) as wav:

              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)

              wav.writeframes(
                  b"".join(frames)
              )

          print(
              "Fallback notification sound created."
          )
          PY

          fi

          test -s \
            android/app/src/main/res/raw/notif.wav


      # =========================================================
      # 20. FCM ICON
      # =========================================================
      - name: Prepare FCM notification icon
        shell: bash
        run: |
          set -e

          mkdir -p \
            android/app/src/main/res/drawable

          if [ -f assets/push_icon.png ]; then
            SOURCE="assets/push_icon.png"
          else
            SOURCE="assets/icon.png"
          fi

          cp \
            "$SOURCE" \
            android/app/src/main/res/drawable/push_icon.png

          test -s \
            android/app/src/main/res/drawable/push_icon.png


      # =========================================================
      # 21. FCM RESOURCES
      # =========================================================
      - name: Configure FCM Android resources
        shell: bash
        run: |
          set -e

          mkdir -p \
            android/app/src/main/res/values

          cat > \
            android/app/src/main/res/values/fcm_strings.xml \
            <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_notification_channel_id">pengumuman_fcm_v3</string>
          </resources>
          XML


          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()


          notification_permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if notification_permission not in text:

              pos = text.find("<manifest")

              end = text.find(
                  ">",
                  pos
              )

              text = (
                  text[:end + 1]
                  + "\n    "
                  + notification_permission
                  + "\n"
                  + text[end + 1:]
              )


          icon_meta = (
              '<meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/push_icon" />'
          )

          channel_meta = (
              '<meta-data '
              'android:name="com.google.firebase.messaging.default_notification_channel_id" '
              'android:resource="@string/default_notification_channel_id" />'
          )


          application_pos = text.find(
              "<application"
          )

          application_end = text.find(
              ">",
              application_pos
          )


          application_block = text[
              application_pos:
              application_end
          ]


          if (
              "default_notification_icon"
              not in application_block
          ):

              text = (
                  text[:application_end + 1]
                  + "\n        "
                  + icon_meta
                  + "\n        "
                  + channel_meta
                  + "\n"
                  + text[application_end + 1:]
              )


          manifest.write_text(text)

          print(
              "FCM resources configured."
          )
          PY


      # =========================================================
      # 22. SECURE APK UPDATER
      # =========================================================
      - name: Configure secure APK updater
        shell: bash
        run: |
          set -e

          MAIN_DIR="android/app/src/main/java/com/parkiranmobiltamu/app"

          MAIN="$MAIN_DIR/AppUpdater.java"

          mkdir -p "$MAIN_DIR"


          cat > "$MAIN" <<'JAVA'
          package com.parkiranmobiltamu.app;

          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.PluginMethod;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          import java.net.HttpURLConnection;
          import java.net.URL;

          import java.security.MessageDigest;

          import java.util.Locale;
          import java.util.concurrent.Executors;


          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdater extends Plugin {

              @PluginMethod
              public void downloadAndInstall(
                      PluginCall call
              ) {

                  final String urlText =
                          call.getString(
                                  "url",
                                  ""
                          );

                  final String expectedSha256 =
                          call.getString(
                                  "sha256",
                                  ""
                          );

                  final String expectedPackage =
                          call.getString(
                                  "packageName",
                                  "com.parkiranmobiltamu.app"
                          );

                  final long expectedVersionCode =
                          call.getLong(
                                  "versionCode",
                                  0L
                          );


                  if (!urlText.startsWith("https://")) {

                      call.reject(
                              "Update hanya boleh menggunakan HTTPS."
                      );

                      return;
                  }


                  try {

                      String host =
                              new URL(urlText)
                                      .getHost()
                                      .toLowerCase(Locale.US);

                      if (
                              !host.equals("github.com")
                              &&
                              !host.equals("www.github.com")
                      ) {

                          call.reject(
                                  "Sumber APK tidak diizinkan."
                          );

                          return;
                      }

                  } catch (Exception e) {

                      call.reject(
                              "URL update tidak valid."
                      );

                      return;
                  }


                  if (
                          !expectedPackage.equals(
                                  getContext()
                                          .getPackageName()
                          )
                  ) {

                      call.reject(
                              "Package APK tidak cocok."
                      );

                      return;
                  }


                  Executors
                          .newSingleThreadExecutor()
                          .execute(
                                  () -> {

                                      File apk = null;

                                      try {

                                          if (
                                                  Build.VERSION.SDK_INT >= 26
                                                  &&
                                                  !getContext()
                                                          .getPackageManager()
                                                          .canRequestPackageInstalls()
                                          ) {

                                              Intent settings =
                                                      new Intent(
                                                              Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                                              Uri.parse(
                                                                      "package:"
                                                                      + getContext()
                                                                      .getPackageName()
                                                              )
                                                      );

                                              settings.addFlags(
                                                      Intent.FLAG_ACTIVITY_NEW_TASK
                                              );

                                              getContext()
                                                      .startActivity(settings);

                                              call.reject(
                                                      "IZIN_INSTALL_REQUIRED",
                                                      "Izinkan pemasangan aplikasi dari sumber ini, lalu tekan UPDATE APK lagi."
                                              );

                                              return;
                                          }


                                          apk =
                                                  downloadApk(
                                                          urlText
                                                  );


                                          if (
                                                  !expectedSha256.isEmpty()
                                                  &&
                                                  !sha256(apk)
                                                          .equalsIgnoreCase(
                                                                  expectedSha256
                                                          )
                                          ) {

                                              apk.delete();

                                              call.reject(
                                                      "HASH_MISMATCH",
                                                      "SHA-256 APK tidak cocok. Update dibatalkan."
                                              );

                                              return;
                                          }


                                          PackageManager pm =
                                                  getContext()
                                                          .getPackageManager();


                                          PackageInfo info =
                                                  pm.getPackageArchiveInfo(
                                                          apk.getAbsolutePath(),
                                                          PackageManager.GET_META_DATA
                                                  );


                                          if (
                                                  info == null
                                                  ||
                                                  !expectedPackage.equals(
                                                          info.packageName
                                                  )
                                          ) {

                                              apk.delete();

                                              call.reject(
                                                      "PACKAGE_MISMATCH",
                                                      "Package APK tidak cocok."
                                              );

                                              return;
                                          }


                                          long downloadedVersion;

                                          if (
                                                  Build.VERSION.SDK_INT >= 28
                                          ) {

                                              downloadedVersion =
                                                      info.getLongVersionCode();

                                          } else {

                                              downloadedVersion =
                                                      info.versionCode;
                                          }


                                          if (
                                                  expectedVersionCode > 0
                                                  &&
                                                  downloadedVersion
                                                          != expectedVersionCode
                                          ) {

                                              apk.delete();

                                              call.reject(
                                                      "VERSION_MISMATCH",
                                                      "VersionCode APK tidak cocok."
                                              );

                                              return;
                                          }


                                          File installFile =
                                                  new File(
                                                          getContext()
                                                                  .getCacheDir(),
                                                          "parkir-update.apk"
                                                  );


                                          if (
                                                  installFile.exists()
                                          ) {

                                              installFile.delete();
                                          }


                                          if (
                                                  !apk.renameTo(
                                                          installFile
                                                  )
                                          ) {

                                              copyFile(
                                                      apk,
                                                      installFile
                                              );

                                              apk.delete();
                                          }


                                          Uri uri =
                                                  FileProvider
                                                          .getUriForFile(
                                                                  getContext(),
                                                                  getContext()
                                                                          .getPackageName()
                                                                          + ".fileprovider",
                                                                  installFile
                                                          );


                                          Intent intent =
                                                  new Intent(
                                                          Intent.ACTION_VIEW
                                                  );


                                          intent.setDataAndType(
                                                  uri,
                                                  "application/vnd.android.package-archive"
                                          );


                                          intent.addFlags(
                                                  Intent.FLAG_ACTIVITY_NEW_TASK
                                                          |
                                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                                          );


                                          getContext()
                                                  .startActivity(intent);


                                          call.resolve();

                                      } catch (Exception e) {

                                          if (
                                                  apk != null
                                                  &&
                                                  apk.exists()
                                          ) {

                                              apk.delete();
                                          }


                                          call.reject(
                                                  "UPDATE_FAILED",
                                                  e.getMessage() == null
                                                          ?
                                                  "Download/update gagal."
                                                          :
                                                  e.getMessage()
                                          );
                                      }
                                  }
                          );
              }


              private File downloadApk(
                      String urlText
              ) throws Exception {

                  File dir =
                          new File(
                                  getContext()
                                          .getCacheDir(),
                                  "updates"
                          );


                  if (
                          !dir.exists()
                          &&
                          !dir.mkdirs()
                  ) {

                      throw new Exception(
                              "Folder update tidak dapat dibuat."
                      );
                  }


                  File out =
                          new File(
                                  dir,
                                  "parkir-update-download.apk"
                          );


                  HttpURLConnection connection =
                          (HttpURLConnection)
                                  new URL(
                                          urlText
                                  ).openConnection();


                  connection.setInstanceFollowRedirects(
                          true
                  );

                  connection.setConnectTimeout(
                          15000
                  );

                  connection.setReadTimeout(
                          30000
                  );

                  connection.connect();


                  int response =
                          connection.getResponseCode();


                  if (
                          response < 200
                          ||
                          response >= 300
                  ) {

                      throw new Exception(
                              "Server update HTTP "
                                      + response
                      );
                  }


                  long maxSize =
                          60L
                          *
                          1024L
                          *
                          1024L;


                  try (
                          InputStream in =
                                  connection.getInputStream();

                          FileOutputStream output =
                                  new FileOutputStream(out)
                  ) {

                      byte[] buffer =
                              new byte[8192];

                      int count;

                      long total = 0;


                      while (
                              (count =
                                      in.read(buffer))
                                      != -1
                      ) {

                          total += count;


                          if (
                                  total > maxSize
                          ) {

                              throw new Exception(
                                      "Ukuran APK terlalu besar."
                              );
                          }


                          output.write(
                                  buffer,
                                  0,
                                  count
                          );
                      }

                  } finally {

                      connection.disconnect();
                  }


                  return out;
              }


              private String sha256(
                      File file
              ) throws Exception {

                  MessageDigest digest =
                          MessageDigest.getInstance(
                                  "SHA-256"
                          );


                  try (
                          InputStream input =
                                  new FileInputStream(
                                          file
                                  )
                  ) {

                      byte[] buffer =
                              new byte[8192];

                      int count;


                      while (
                              (count =
                                      input.read(buffer))
                                      != -1
                      ) {

                          digest.update(
                                  buffer,
                                  0,
                                  count
                          );
                      }
                  }


                  StringBuilder result =
                          new StringBuilder();


                  for (
                          byte b :
                          digest.digest()
                  ) {

                      result.append(
                              String.format(
                                      Locale.US,
                                      "%02x",
                                      b
                              )
                      );
                  }


                  return result.toString();
              }


              private void copyFile(
                      File source,
                      File destination
              ) throws Exception {

                  try (
                          InputStream input =
                                  new FileInputStream(
                                          source
                                  );

                          OutputStream output =
                                  new FileOutputStream(
                                          destination
                                  )
                  ) {

                      byte[] buffer =
                              new byte[8192];

                      int count;


                      while (
                              (count =
                                      input.read(buffer))
                                      != -1
                      ) {

                          output.write(
                                  buffer,
                                  0,
                                  count
                          );
                      }
                  }
              }
          }
