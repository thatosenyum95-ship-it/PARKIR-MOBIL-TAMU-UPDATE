name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "update.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify project
        shell: bash
        run: |
          set -e
          test -f package.json
          test -f www/index.html
          test -f capacitor.config.ts
          test -f google-services.json
          test -f src/native-bridge.js

      - name: Verify Firebase
        shell: bash
        run: |
          set -e
          node <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("google-services.json", "utf8"));

          if (data.project_info?.project_id !== "parkir-mobil") {
            throw new Error("Firebase project harus parkir-mobil");
          }

          const found = (data.client || []).some(
            client =>
              client.client_info?.android_client_info?.package_name ===
              "com.parkiranmobiltamu.app"
          );

          if (!found) {
            throw new Error("Package com.parkiranmobiltamu.app tidak ditemukan");
          }

          console.log("Firebase config OK.");
          NODE

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          npm install --no-audit --no-fund
          npx cap --version
          npx esbuild --version
          npx tsc --version

      - name: Bundle native bridge
        shell: bash
        run: |
          set -e
          mkdir -p www
          npx esbuild src/native-bridge.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/native-bridge.js
          test -s www/native-bridge.js

      - name: Verify web assets
        shell: bash
        run: |
          set -e
          test -s www/index.html
          test -s www/native-bridge.js
          grep -q "native-bridge.js" www/index.html

      - name: Create Android platform
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Install Firebase Android config
        shell: bash
        run: |
          set -e
          cp google-services.json android/app/google-services.json
          test -f android/app/google-services.json

      - name: Verify Android Gradle setup
        shell: bash
        run: |
          set -e
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

      # Capacitor sync MUST happen before custom native Android edits.
      - name: Sync Capacitor
        shell: bash
        run: |
          set -e
          npx cap sync android
          chmod +x android/gradlew

      - name: Generate CEK VAR launcher icon
        shell: bash
        run: |
          set -e

          test -s assets/icon.png

          RES="android/app/src/main/res"

          # Hapus launcher adaptive bawaan Capacitor supaya Android tidak
          # mengambil icon default dan menimpa icon CEK VAR.
          rm -rf "$RES/mipmap-anydpi" "$RES/mipmap-anydpi-v26"
          find "$RES" -type f \( \
            -name 'ic_launcher.png' -o \
            -name 'ic_launcher_round.png' -o \
            -name 'ic_launcher.xml' -o \
            -name 'ic_launcher_round.xml' \
          \) -delete

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # Pakai file CEK VAR asli tanpa ImageMagick/resize.
          # Android akan melakukan scaling sesuai density perangkat.
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/icon.png "$RES/mipmap-$dir/ic_launcher.png"
            cp assets/icon.png "$RES/mipmap-$dir/ic_launcher_round.png"
          done

          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "$RES/mipmap-$dir/ic_launcher.png"
            test -s "$RES/mipmap-$dir/ic_launcher_round.png"
          done

          if find "$RES" -type f \( -name 'ic_launcher.xml' -o -name 'ic_launcher_round.xml' \) | grep -q .; then
            echo "ERROR: adaptive launcher icon masih ada"
            exit 1
          fi

          echo "CEK VAR launcher icon berhasil dipasang ke Android resources."

      - name: Prepare notification resources
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/res/raw
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values

          if [ -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png ]; then
            cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
              android/app/src/main/res/drawable/push_icon.png
          fi

          if [ ! -f android/app/src/main/res/drawable/push_icon.png ]; then
            python3 <<'PY'
          from pathlib import Path
          import struct
          import zlib

          width = height = 192
          rows = []

          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  dx = x - width / 2
                  dy = y - height / 2
                  inside = (dx * dx + dy * dy) ** 0.5 < 78
                  pixel = (235, 235, 235, 255) if inside else (18, 18, 18, 255)
                  row.extend(pixel)
              rows.append(bytes(row))

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data)) + kind + data +
                  struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          raw = b"".join(rows)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")

          Path("android/app/src/main/res/drawable/push_icon.png").write_bytes(png)
          PY
          fi

          cp assets/notif.wav android/app/src/main/res/raw/notif.wav
          test -s android/app/src/main/res/raw/notif.wav

          cat > android/app/src/main/res/values/fcm_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_notification_channel_id">pengumuman_fcm_v4</string>
          </resources>
          XML

      - name: Configure Android manifest safely
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("android/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(path)
          root = tree.getroot()

          if root.tag != "manifest":
              raise SystemExit("Root AndroidManifest bukan <manifest>")

          permissions = {
              "android.permission.CAMERA",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          }

          existing_permissions = {
              node.get(f"{{{android_ns}}}name")
              for node in root.findall("uses-permission")
          }

          for permission in sorted(permissions - existing_permissions):
              ET.SubElement(
                  root,
                  "uses-permission",
                  {f"{{{android_ns}}}name": permission},
              )

          app = root.find("application")
          if app is None:
              raise SystemExit("<application> tidak ditemukan")

          app.set(f"{{{android_ns}}}icon", "@mipmap/ic_launcher")
          app.set(f"{{{android_ns}}}roundIcon", "@mipmap/ic_launcher_round")

          metadata = {
              node.get(f"{{{android_ns}}}name"): node
              for node in app.findall("meta-data")
          }

          def ensure_metadata(name, resource):
              node = metadata.get(name)
              if node is None:
                  node = ET.SubElement(app, "meta-data")
              node.set(f"{{{android_ns}}}name", name)
              node.set(f"{{{android_ns}}}resource", resource)

          ensure_metadata(
              "com.google.firebase.messaging.default_notification_icon",
              "@drawable/push_icon",
          )
          ensure_metadata(
              "com.google.firebase.messaging.default_notification_channel_id",
              "@string/default_notification_channel_id",
          )

          authority = "${applicationId}.fileprovider"
          providers = app.findall("provider")
          provider = None

          for node in providers:
              if node.get(f"{{{android_ns}}}authorities") == authority:
                  provider = node
                  break

          if provider is None:
              provider = ET.SubElement(app, "provider")

          provider.set(
              f"{{{android_ns}}}name",
              "androidx.core.content.FileProvider",
          )
          provider.set(
              f"{{{android_ns}}}authorities",
              authority,
          )
          provider.set(f"{{{android_ns}}}exported", "false")
          provider.set(f"{{{android_ns}}}grantUriPermissions", "true")

          provider_meta = None
          for node in provider.findall("meta-data"):
              if node.get(f"{{{android_ns}}}name") == "android.support.FILE_PROVIDER_PATHS":
                  provider_meta = node
                  break

          if provider_meta is None:
              provider_meta = ET.SubElement(provider, "meta-data")

          provider_meta.set(
              f"{{{android_ns}}}name",
              "android.support.FILE_PROVIDER_PATHS",
          )
          provider_meta.set(
              f"{{{android_ns}}}resource",
              "@xml/file_paths",
          )

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("AndroidManifest.xml valid and configured.")
          PY

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("android/app/src/main/AndroidManifest.xml")
          print("Manifest XML validation: OK")
          PY

      - name: Configure secure APK updater
        shell: bash
        run: |
          set -e

          MAIN_DIR="android/app/src/main/java/com/parkiranmobiltamu/app"
          mkdir -p "$MAIN_DIR"
          mkdir -p android/app/src/main/res/xml

          cat > "$MAIN_DIR/AppUpdater.java" <<'JAVA'
          package com.parkiranmobiltamu.app;

          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;

          import androidx.core.content.FileProvider;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          import java.io.*;
          import java.net.*;
          import java.security.MessageDigest;
          import java.util.Locale;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "AppUpdater")
          public class AppUpdater extends Plugin {
              @PluginMethod()
              public void downloadAndInstall(PluginCall call) {
                  String urlText = call.getString("url", "");
                  String expectedSha256 = call.getString("sha256", "");
                  String expectedPackage = call.getString(
                      "packageName",
                      "com.parkiranmobiltamu.app"
                  );
                  long expectedVersionCode = call.getLong("versionCode", 0L);

                  if (!urlText.startsWith("https://")) {
                      call.reject("Update hanya boleh menggunakan HTTPS.");
                      return;
                  }

                  try {
                      String host = new URL(urlText).getHost().toLowerCase(Locale.US);
                      if (!host.equals("github.com") && !host.equals("www.github.com")) {
                          call.reject("Sumber APK tidak diizinkan.");
                          return;
                      }
                  } catch (Exception e) {
                      call.reject("URL update tidak valid.");
                      return;
                  }

                  if (!expectedPackage.equals(getContext().getPackageName())) {
                      call.reject("Package APK tidak cocok.");
                      return;
                  }

                  Executors.newSingleThreadExecutor().execute(() -> {
                      File apk = null;
                      try {
                          if (Build.VERSION.SDK_INT >= 26 &&
                              !getContext().getPackageManager().canRequestPackageInstalls()) {
                              Intent settings = new Intent(
                                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:" + getContext().getPackageName())
                              );
                              settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              getContext().startActivity(settings);
                              call.reject(
                                  "IZIN_INSTALL_REQUIRED",
                                  "Izinkan pemasangan aplikasi dari sumber ini, lalu tekan UPDATE APK lagi."
                              );
                              return;
                          }

                          apk = downloadApk(urlText);

                          if (!expectedSha256.isEmpty() &&
                              !sha256(apk).equalsIgnoreCase(expectedSha256)) {
                              apk.delete();
                              call.reject("HASH_MISMATCH", "SHA-256 APK tidak cocok.");
                              return;
                          }

                          PackageManager pm = getContext().getPackageManager();
                          PackageInfo info = pm.getPackageArchiveInfo(
                              apk.getAbsolutePath(),
                              PackageManager.GET_META_DATA
                          );

                          if (info == null || !expectedPackage.equals(info.packageName)) {
                              apk.delete();
                              call.reject("PACKAGE_MISMATCH", "Package APK tidak cocok.");
                              return;
                          }

                          long version = Build.VERSION.SDK_INT >= 28
                              ? info.getLongVersionCode()
                              : info.versionCode;

                          if (expectedVersionCode > 0 && version != expectedVersionCode) {
                              apk.delete();
                              call.reject("VERSION_MISMATCH", "VersionCode APK tidak cocok.");
                              return;
                          }

                          File installFile = new File(
                              getContext().getCacheDir(),
                              "parkir-update.apk"
                          );

                          if (installFile.exists()) installFile.delete();

                          if (!apk.renameTo(installFile)) {
                              copyFile(apk, installFile);
                              apk.delete();
                          }

                          Uri uri = FileProvider.getUriForFile(
                              getContext(),
                              getContext().getPackageName() + ".fileprovider",
                              installFile
                          );

                          Intent intent = new Intent(Intent.ACTION_VIEW);
                          intent.setDataAndType(
                              uri,
                              "application/vnd.android.package-archive"
                          );
                          intent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK |
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          );

                          getContext().startActivity(intent);
                          call.resolve();

                      } catch (Exception e) {
                          if (apk != null && apk.exists()) apk.delete();
                          call.reject(
                              "UPDATE_FAILED",
                              e.getMessage() == null
                                  ? "Download/update gagal."
                                  : e.getMessage()
                          );
                      }
                  });
              }

              private File downloadApk(String urlText) throws Exception {
                  File dir = new File(getContext().getCacheDir(), "updates");
                  if (!dir.exists() && !dir.mkdirs()) {
                      throw new Exception("Folder update tidak dapat dibuat.");
                  }

                  File out = new File(dir, "parkir-update-download.apk");
                  HttpURLConnection connection =
                      (HttpURLConnection) new URL(urlText).openConnection();

                  connection.setInstanceFollowRedirects(true);
                  connection.setConnectTimeout(15000);
                  connection.setReadTimeout(30000);
                  connection.connect();

                  int response = connection.getResponseCode();
                  if (response < 200 || response >= 300) {
                      throw new Exception("Server update HTTP " + response);
                  }

                  long maxSize = 60L * 1024L * 1024L;

                  try (
                      InputStream in = connection.getInputStream();
                      FileOutputStream output = new FileOutputStream(out)
                  ) {
                      byte[] buffer = new byte[8192];
                      int count;
                      long total = 0;

                      while ((count = in.read(buffer)) != -1) {
                          total += count;
                          if (total > maxSize) {
                              throw new Exception("Ukuran APK terlalu besar.");
                          }
                          output.write(buffer, 0, count);
                      }
                  } finally {
                      connection.disconnect();
                  }

                  return out;
              }

              private String sha256(File file) throws Exception {
                  MessageDigest digest = MessageDigest.getInstance("SHA-256");

                  try (InputStream input = new FileInputStream(file)) {
                      byte[] buffer = new byte[8192];
                      int count;
                      while ((count = input.read(buffer)) != -1) {
                          digest.update(buffer, 0, count);
                      }
                  }

                  StringBuilder result = new StringBuilder();
                  for (byte b : digest.digest()) {
                      result.append(String.format(Locale.US, "%02x", b));
                  }
                  return result.toString();
              }

              private void copyFile(File source, File destination) throws Exception {
                  try (
                      InputStream input = new FileInputStream(source);
                      OutputStream output = new FileOutputStream(destination)
                  ) {
                      byte[] buffer = new byte[8192];
                      int count;
                      while ((count = input.read(buffer)) != -1) {
                          output.write(buffer, 0, count);
                      }
                  }
              }
          }
          JAVA

          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="update_cache" path="updates/" />
              <cache-path name="root_cache" path="." />
          </paths>
          XML

          test -s "$MAIN_DIR/AppUpdater.java"
          test -s android/app/src/main/res/xml/file_paths.xml

      - name: Verify AppUpdater source
        shell: bash
        run: |
          set -e
          FILE="android/app/src/main/java/com/parkiranmobiltamu/app/AppUpdater.java"
          test -f "$FILE"
          ! grep -q "com.getcapacitor.annotation.PluginMethod" "$FILE"
          grep -q "import com.getcapacitor.PluginMethod;" "$FILE"
          grep -q "@PluginMethod()" "$FILE"
          echo "AppUpdater source OK."

      - name: Set app version
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = re.sub(r"versionCode\s+\d+", "versionCode 6", text, count=1)
          text = re.sub(
              r'versionName\s+[\'"][^\'"]+[\'"]',
              'versionName "1.2.4"',
              text,
              count=1
          )

          path.write_text(text)
          PY

          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Final manifest validation
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("android/app/src/main/AndroidManifest.xml")
          print("Final AndroidManifest.xml validation: OK")
          PY

          test -f android/app/src/main/res/xml/file_paths.xml
          test -f android/app/src/main/java/com/parkiranmobiltamu/app/AppUpdater.java

      - name: Validate app JavaScript and camera flow
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("www/index.html").read_text()
          match = re.search(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit("Script module utama tidak ditemukan")

          js = match.group(1)
          Path("/tmp/parkir-main.js").write_text(js)

          if "async async function capturePhoto" in js:
              raise SystemExit("Sintaks capturePhoto masih mengandung async async")
          if "async function capturePhoto" not in js:
              raise SystemExit("capturePhoto tidak ditemukan")
          if "file input" in js.lower() or "jalur kamera fallback" in js.lower():
              raise SystemExit("Fallback file picker/kamera terdeteksi")
          if 'const APP_VERSION_CODE = 6;' not in js:
              raise SystemExit("APP_VERSION_CODE bukan 6")
          if 'const APP_VERSION_NAME = "1.2.4";' not in js:
              raise SystemExit("APP_VERSION_NAME bukan 1.2.4")
          print("Camera flow dan version constants: OK")
          PY

          node --check /tmp/parkir-main.js
          echo "JavaScript syntax validation: OK"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          mkdir -p dist

          APK=$(find android/app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          cp "$APK" dist/parkir-mobil-tamu-v1.2.4-debug.apk

          sha256sum \
            dist/parkir-mobil-tamu-v1.2.4-debug.apk \
            > dist/parkir-mobil-tamu-v1.2.4-debug.apk.sha256

          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: parkir-mobil-tamu-v1.2.4-debug-apk
          path: |
            dist/parkir-mobil-tamu-v1.2.4-debug.apk
            dist/parkir-mobil-tamu-v1.2.4-debug.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          VERSION_NAME="1.2.4"
          VERSION_CODE="6"
          APK="dist/parkir-mobil-tamu-v1.2.4-debug.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          TAG="v${VERSION_NAME}"
          RELEASE_URL="https://github.com/thatosenyum95-ship-it/PARKIR-MOBIL-TAMU-UPDATE/releases/download/${TAG}/parkir-mobil-tamu-v1.2.4-debug.apk"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "$APK" --clobber
          else
            gh release create "${TAG}" "$APK" \
              --title "PARKIR MOBIL TAMU ${VERSION_NAME}" \
              --notes "PARKIR MOBIL TAMU VersionName ${VERSION_NAME}, VersionCode ${VERSION_CODE}."
          fi

          python3 <<PY
          import json
          from pathlib import Path

          path = Path("update.json")
          data = {
              "appName": "PARKIR MOBIL TAMU",
              "packageName": "com.parkiranmobiltamu.app",
              "latestVersionCode": int("${VERSION_CODE}"),
              "latestVersionName": "${VERSION_NAME}",
              "minimumVersionCode": 1,
              "mandatory": False,
              "downloadUrl": "${RELEASE_URL}",
              "sha256": "${SHA256}",
              "changelog": [
                  "Kamera dan galeri dipisahkan: tombol KAMERA langsung membuka kamera.",
                  "Tombol GALERI langsung membuka galeri tanpa fallback ke kamera/file picker.",
                  "VersionName 1.2.4 dan VersionCode 5."
              ]
          }
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "Update release manifest to ${VERSION_NAME}"
          git push

      - name: Build success
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD BERHASIL"
          echo "PARKIR MOBIL TAMU"
          echo "Version: 1.2.4"
          echo "VersionCode: 6"
          echo "========================================"
